<ion-content *ngIf="pais">
  <ion-header>
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-back-button defaultHref="/paises"></ion-back-button>
      </ion-buttons>
      <ion-title>{{ pais.name?.common }}</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card style="display: flex; flex-direction: column;">
    <img [src]="pais.flags?.png" [alt]="pais.name?.common + ' bandera'">

    <ion-card-header>
      <ion-card-title>{{ pais.name?.official }}</ion-card-title>
      <ion-card-subtitle>{{ pais.region }}</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <ion-list>
        <ion-item>
          <ion-label>
            <h2>Capital</h2>
            <p>{{ pais.capital?.join(', ') || 'No disponible' }}</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-label>
            <h2>Región</h2>
            <p>{{ pais.region }}</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-label>
            <h2>Código de País</h2>
            <p>{{ pais.cca3 }}</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-label>
            <h2>Idiomas</h2>
            <p>{{ obtenerIdiomas(pais.languages) }}</p>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>
</ion-content>
